name: CI

# Stages: test -> build -> test-template + security + build-vm + build-oci
#         -> test-vm + test-oci -> release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this pxmxfw version from main, e.g. 0.2.0 (the +alpine part is added)
        type: string
        default: ''
  # Weekly rebuild of edge with fresh Alpine packages (and a Trivy scan).
  # When Alpine has a new release, this also publishes the next version.
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC

permissions:
  contents: read

# one run per branch or tag at a time, so edge releases never race
concurrency:
  group: build-${{ github.ref }}

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: 0.64.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y busybox dnsmasq-base nftables shellcheck libpam0g-dev libsqlite3-dev wireguard-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: webui/go.mod
          cache-dependency-path: webui/go.sum

      - name: Web UI server (vet and tests, built with PAM)
        working-directory: webui
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet -tags libsqlite3 ./...
          go test -tags libsqlite3 ./...

      # Lets the tests bring up a real tunnel in a network namespace
      - name: Load the wireguard module
        run: sudo modprobe wireguard || true

      - name: Shellcheck
        run: |
          shellcheck -s sh -S warning -e SC2034 \
            rootfs/usr/sbin/pxmxfw rootfs/usr/lib/pxmxfw/lib.sh \
            rootfs/etc/init.d/pxmxfw* tests/run.sh tests/oci-run.sh build.sh targets/vm/mkimage.sh

      # As root, so generated rulesets are loaded into a throwaway netns
      - name: Tests (dash)
        run: sudo tests/run.sh
      - name: Tests (busybox ash, the shell Alpine uses)
        run: sudo SH="busybox ash" tests/run.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      alpine: ${{ steps.plan.outputs.alpine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Automatic releases: when main is built on a newer Alpine than the
      # last v* release, publish the next patch version, e.g.
      # v0.1.0+alpine3.22.6 -> v0.1.1+alpine3.22.7. A manual run with
      # "release" set publishes that version instead.
      - name: Decide on an automatic release
        id: plan
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          branch=$(sed -n 's/^ALPINE_VERSION=\${ALPINE_VERSION:-\([0-9.]*\)}$/\1/p' build.sh)
          alpine=$(curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v$branch/releases/x86_64/latest-releases.yaml" |
            sed -n 's/^ *version: \([0-9.]*\)$/\1/p' | head -n1)
          test -n "$alpine"
          last=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "Alpine $alpine; last release ${last:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$RELEASE" ]; then
            printf '%s\n' "$RELEASE" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' ||
              { echo "::error::release must look like 1.2.3"; exit 1; }
            ! git tag -l "v$RELEASE+*" | grep -q . ||
              { echo "::error::v$RELEASE is already released"; exit 1; }
            echo "tag=v$RELEASE+alpine$alpine" >> "$GITHUB_OUTPUT"
            echo "alpine=$alpine" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case $last in
            '') echo "No v* release yet, edge only"; exit 0 ;;
            *+alpine"$alpine") exit 0 ;;
          esac
          ver=${last#v}
          ver=${ver%%+*}
          echo "tag=v${ver%.*}.$((${ver##*.} + 1))+alpine$alpine" >> "$GITHUB_OUTPUT"
          echo "alpine=$alpine" >> "$GITHUB_OUTPUT"

      - name: Build template (podman)
        env:
          PXMXFW_VERSION: ${{ steps.plan.outputs.tag }}
        run: |
          ./build.sh --podman -o out
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: pxmxfw-template
          path: out/*.tar.gz
          if-no-files-found: error

  # Boots nothing: checks the generated config and drives the web UI API
  # inside the unpacked template with chroot.
  test-template:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-template
          path: out

      - name: Check config inside the template
        run: |
          sudo mkdir /tmp/fw
          sudo tar -xzf out/*.tar.gz -C /tmp/fw
          sudo mount --bind /dev /tmp/fw/dev
          sudo chroot /tmp/fw nft -c -f /etc/nftables.nft
          sudo chroot /tmp/fw dnsmasq --test

      - name: Check the web UI login inside the template
        run: |
          # The UI logs in through PAM with the container's root password
          echo 'root:ci-test-pw' | sudo chroot /tmp/fw chpasswd
          sudo mount -t proc proc /tmp/fw/proc
          sudo chroot /tmp/fw /usr/sbin/pxmxfw-webui -listen 127.0.0.1:8443 > webui.log 2>&1 &
          for i in $(seq 40); do curl -ks -o /dev/null https://127.0.0.1:8443/ && break; sleep 0.5; done
          api=https://127.0.0.1:8443/api
          code() { curl -ks -b jar -c jar -H 'X-Pxmxfw: 1' -o /dev/null -w '%{http_code}' "$@"; }
          call() { curl -fksS -b jar -c jar -H 'X-Pxmxfw: 1' "$@"; }
          test "$(code "$api?action=file&name=settings")" = 401
          test "$(code -d '{"user":"root","password":"wrong"}' "$api?action=login")" = 401
          call -d '{"user":"root","password":"ci-test-pw"}' "$api?action=login"
          call "$api?action=file&name=settings" | grep -q '^IPV6=no'
          # changes need a fresh confirmation, and are validated by pxmxfw
          test "$(code --data-binary 'input accept in=eth1 proto=tcp dport=2222' "$api?action=save&name=rules")" = 403
          call -d '{"password":"ci-test-pw"}' "$api?action=stepup"
          test "$(code --data-binary 'input accept in=eth1;reboot' "$api?action=save&name=rules")" = 422
          test "$(code --data-binary 'input accept in=eth9' "$api?action=save&name=rules")" = 422
          call --data-binary 'input accept in=eth1 proto=tcp dport=2222 # test' "$api?action=save&name=rules"
          grep -qx 'input accept in=eth1 proto=tcp dport=2222 # test' /tmp/fw/etc/pxmxfw/rules
          call -o /dev/null https://127.0.0.1:8443/alpine.min.js
          # web terminal: xterm.js is served and root's login shell exists
          for f in xterm.js xterm-fit.js xterm.css; do call -o /dev/null "https://127.0.0.1:8443/$f"; done
          call -X POST "$api?action=term" | tee term.out
          grep -q '^ok' term.out
          sudo chroot /tmp/fw test -x "$(awk -F: '$1 == "root" { print $7 }' /tmp/fw/etc/passwd)"
          # packages: search and install a small one through the UI's API
          sudo cp -L /etc/resolv.conf /tmp/fw/etc/resolv.conf
          call "$api?action=pkg-search&name=tree" | tee search.out
          grep -q '^tree-' search.out
          call -X POST "$api?action=pkg-add&name=tree" || { cat webui.log; exit 1; }
          grep -qx tree /tmp/fw/etc/pxmxfw/packages
          test -x /tmp/fw/usr/bin/tree
          call "$api?action=pkgs" | grep -q '^tree [0-9]'
          sudo pkill -f pxmxfw-webui || true
          sudo umount /tmp/fw/proc /tmp/fw/dev
          cat webui.log

  # The VM disk image, made from the template the build stage just made, so
  # both carry the same packages and pxmxfw version.
  build-vm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-template
          path: template

      - name: Build the VM image (podman)
        run: |
          ./build.sh --podman -t vm -f template/*.tar.gz -o out
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: pxmxfw-vm
          path: out/*.qcow2
          if-no-files-found: error
          compression-level: 0 # the qcow2 is compressed already

  # Boots the VM image in QEMU (KVM) like a Proxmox VM and checks it over
  # the serial console: DHCP on the WAN, the firewall, the web UI, shutdown.
  test-vm:
    runs-on: ubuntu-latest
    needs: build-vm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-vm
          path: out

      - name: Install QEMU and allow KVM
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot and check the VM
        run: timeout 600 tests/vm-boot.py out/*.qcow2

      - name: Serial console log
        if: always()
        run: cat vm-serial.log || true

  # The podman/docker image, made from the template like the VM image.
  build-oci:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-template
          path: template

      - name: Build the container image (podman)
        run: |
          ./build.sh --podman -t oci -f template/*.tar.gz -o out
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: pxmxfw-oci
          path: out/*.oci.tar
          if-no-files-found: error

  # Runs the image with podman and with docker, with a WAN and a LAN network:
  # boot, the firewall, the web UI on the LAN, a LAN client routed and NATed
  # out of the WAN, and stop.
  test-oci:
    runs-on: ubuntu-latest
    needs: build-oci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-oci
          path: out

      - name: Load the nftables modules on the host
        run: sudo modprobe -a nf_tables nft_chain_nat nft_ct nft_masq nft_reject_inet nft_fib_inet || true

      - name: Run with podman
        run: sudo tests/oci-run.sh podman out/*.oci.tar

      - name: Run with docker
        run: sudo tests/oci-run.sh docker out/*.oci.tar

  # Report only: known CVEs with a fix in Alpine or Go. Rebuilding picks up
  # fixed Alpine packages; the weekly run does that for edge.
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-template
          path: out

      - name: CVE scan (Trivy)
        run: |
          sudo mkdir /tmp/fw
          sudo tar -xzf out/*.tar.gz -C /tmp/fw
          sudo podman run --rm -v /tmp/fw:/fw:ro "docker.io/aquasec/trivy:$TRIVY_VERSION" \
            rootfs --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 3 /fw > trivy.txt || rc=$?
          cat trivy.txt
          case ${rc:-0} in
            0) echo "Trivy: no fixable HIGH or CRITICAL CVEs" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::warning::Trivy found fixable HIGH or CRITICAL CVEs in the template"
               { echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$rc" ;;
          esac

  # GitHub releases (edge and v*) and container images on ghcr.io.
  # Proxmox downloads the template by URL:
  #   releases/latest/download/pxmxfw_amd64.tar.gz (newest v* release)
  #   releases/download/edge/pxmxfw_amd64.tar.gz (newest main build)
  # or pulls the same root filesystem as an OCI image:
  #   ghcr.io/rumblebump/pxmxfw:latest, :edge, :0.1.0-alpine3.22.6
  # and the VM disk the same way: .../download/pxmxfw_amd64.qcow2
  # The podman/docker image is ghcr.io/rumblebump/pxmxfw-oci (same tags) and
  # .../download/pxmxfw_amd64.oci.tar (for podman load / docker load).
  release:
    runs-on: ubuntu-latest
    needs: [build, test-template, security, test-vm, test-oci]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-template
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-vm
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: pxmxfw-oci
          path: out

      - name: Pick what to publish
        id: what
        env:
          PLANNED_TAG: ${{ needs.build.outputs.tag }}
          PLANNED_ALPINE: ${{ needs.build.outputs.alpine }}
        run: |
          cd out
          alpine=$(ls alpine-*-pxmxfw-*_amd64.tar.gz | sed 's/^alpine-\([0-9.]*\)-pxmxfw-.*/\1/')
          echo "alpine=$alpine" >> "$GITHUB_OUTPUT"
          tag=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            case $tag in
              *+alpine*) [ "${tag##*+alpine}" = "$alpine" ] ||
                { echo "::error::tag says Alpine ${tag##*+alpine}, built on $alpine"; exit 1; } ;;
            esac
          else
            echo "edge=yes" >> "$GITHUB_OUTPUT"
            if [ -n "$PLANNED_TAG" ]; then
              if [ "$alpine" = "$PLANNED_ALPINE" ]; then
                tag=$PLANNED_TAG
              else
                echo "::warning::built on Alpine $alpine, expected $PLANNED_ALPINE; no release this time"
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Fixed name so the download URLs above never change
          cp alpine-*-pxmxfw-*_amd64.tar.gz pxmxfw_amd64.tar.gz
          cp alpine-*-pxmxfw-*_amd64.qcow2 pxmxfw_amd64.qcow2
          cp alpine-*-pxmxfw-*_amd64.oci.tar pxmxfw_amd64.oci.tar

      # Every merge to main and the weekly run replace the "edge" prerelease
      - name: GitHub release (edge)
        if: steps.what.outputs.edge == 'yes'
        env:
          ALPINE: ${{ steps.what.outputs.alpine }}
        run: |
          cd out
          sha256sum pxmxfw_amd64.tar.gz pxmxfw_amd64.qcow2 pxmxfw_amd64.oci.tar > SHA256SUMS
          gh release delete edge --cleanup-tag --yes 2>/dev/null || true
          gh release create edge pxmxfw_amd64.tar.gz pxmxfw_amd64.qcow2 pxmxfw_amd64.oci.tar SHA256SUMS --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "edge (latest main)" \
            --notes "Built from ${GITHUB_SHA::7} on main with Alpine $ALPINE. Not a release; use a v* release for production."

      - name: GitHub release (version)
        if: steps.what.outputs.tag != ''
        env:
          TAG: ${{ steps.what.outputs.tag }}
          ALPINE: ${{ steps.what.outputs.alpine }}
        run: |
          cd out
          sha256sum *.tar.gz *.qcow2 *.oci.tar > SHA256SUMS
          gh release create "$TAG" *.tar.gz *.qcow2 *.oci.tar SHA256SUMS --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Built on Alpine $ALPINE." --generate-notes
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Container image (ghcr.io)
        env:
          TAG: ${{ steps.what.outputs.tag }}
          EDGE: ${{ steps.what.outputs.edge }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=
          [ "$EDGE" != yes ] || tags=edge
          # OCI tags cannot hold "+": v0.1.0+alpine3.22.6 -> 0.1.0-alpine3.22.6
          [ -z "$TAG" ] || tags="$tags ${TAG#v} latest"
          tags=${tags//+/-}
          [ -n "${tags// }" ] || exit 0
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman import \
            --change 'CMD ["/sbin/init"]' \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL org.opencontainers.image.description=pxmxfw firewall for Proxmox LXC" \
            out/pxmxfw_amd64.tar.gz "$image:build"
          # the podman/docker image (build.sh -t oci) loads as pxmxfw:latest
          sudo podman load -i out/pxmxfw_amd64.oci.tar
          for t in $tags; do
            sudo podman tag "$image:build" "$image:$t"
            sudo podman push "$image:$t"
            sudo podman tag localhost/pxmxfw:latest "$image-oci:$t"
            sudo podman push "$image-oci:$t"
            echo "Pushed $image:$t and $image-oci:$t" >> "$GITHUB_STEP_SUMMARY"
          done
