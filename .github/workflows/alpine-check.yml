name: Weekly Alpine and CVE check

# Once a week, look for a new Alpine point release on the branch build.sh
# uses (e.g. 3.22.6 -> 3.22.7) and scan the edge template for known CVEs
# that have a fix. If edge was built on an older Alpine, or a fix is out,
# run the Build template workflow on main, which replaces edge with fresh
# packages. New Alpine branches (3.23) come as Renovate PRs instead.
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild edge even if Alpine has not changed
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # to start the build workflow

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: 0.64.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compare Alpine releases and scan edge
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          mirror=https://dl-cdn.alpinelinux.org/alpine
          latest() {
            curl -fsSL "$mirror/$1/releases/x86_64/latest-releases.yaml" |
              sed -n 's/^ *version: \([0-9.]*\)$/\1/p' | head -n1
          }
          branch=$(sed -n 's/^ALPINE_VERSION=\${ALPINE_VERSION:-\([0-9.]*\)}$/\1/p' build.sh)
          test -n "$branch"
          new=$(latest "v$branch")
          test -n "$new"
          # build.yml writes "Alpine X.Y.Z" into the edge release notes
          built=$(gh release view edge --json body -q .body 2>/dev/null |
            sed -n 's/.*Alpine \([0-9][0-9.]*[0-9]\).*/\1/p' | head -n1) || true
          echo "Alpine $branch: latest $new, edge built on ${built:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"

          stable=$(latest latest-stable)
          case $stable in
            "$branch".*|'') ;;
            *) echo "::notice::Alpine $stable is out; build.sh still uses $branch" ;;
          esac

          reason=
          [ "$new" = "$built" ] || reason="Alpine $new"
          [ "$FORCE" != true ] || reason="manual run"

          # Known CVEs in edge that a rebuild would fix
          if [ -z "$reason" ]; then
            mkdir edge fw
            gh release download edge -p pxmxfw_amd64.tar.gz -D edge
            sudo tar -xzf edge/pxmxfw_amd64.tar.gz -C fw
            sudo podman run --rm -v "$PWD/fw:/fw:ro" "docker.io/aquasec/trivy:$TRIVY_VERSION" \
              rootfs --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --exit-code 3 /fw > trivy.txt || rc=$?
            cat trivy.txt
            case ${rc:-0} in
              0) ;;
              3) reason="fixable CVEs"
                 { echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
              *) exit "$rc" ;;
            esac
          fi

          if [ -z "$reason" ]; then
            echo "Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run build.yml --ref main
          echo "Started a rebuild of edge ($reason)." | tee -a "$GITHUB_STEP_SUMMARY"
