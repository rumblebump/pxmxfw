name: Build template

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y busybox dnsmasq-base nftables shellcheck libpam0g-dev libsqlite3-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: webui/go.mod
          cache-dependency-path: webui/go.sum

      - name: Web UI server (vet and tests, built with PAM)
        working-directory: webui
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet -tags libsqlite3 ./...
          go test -tags libsqlite3 ./...

      - name: Shellcheck
        run: |
          shellcheck -s sh -S warning -e SC2034 \
            rootfs/usr/sbin/pxmxfw rootfs/usr/lib/pxmxfw/lib.sh \
            rootfs/etc/init.d/pxmxfw* tests/run.sh

      # As root, so generated rulesets are loaded into a throwaway netns
      - name: Tests (dash)
        run: sudo tests/run.sh
      - name: Tests (busybox ash, the shell Alpine uses)
        run: sudo SH="busybox ash" tests/run.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build template (podman)
        run: ./build.sh --podman -o out

      - name: Check config inside the template
        run: |
          sudo mkdir /tmp/fw
          sudo tar -xzf out/*.tar.gz -C /tmp/fw
          sudo mount --bind /dev /tmp/fw/dev
          sudo chroot /tmp/fw nft -c -f /etc/nftables.nft
          sudo chroot /tmp/fw dnsmasq --test
          ls -l out/

      - name: Check the web UI login inside the template
        run: |
          # The UI logs in through PAM with the container's root password
          echo 'root:ci-test-pw' | sudo chroot /tmp/fw chpasswd
          sudo mount -t proc proc /tmp/fw/proc
          sudo chroot /tmp/fw /usr/sbin/pxmxfw-webui -listen 127.0.0.1:8443 > webui.log 2>&1 &
          for i in $(seq 40); do curl -ks -o /dev/null https://127.0.0.1:8443/ && break; sleep 0.5; done
          api=https://127.0.0.1:8443/api
          code() { curl -ks -b jar -c jar -H 'X-Pxmxfw: 1' -o /dev/null -w '%{http_code}' "$@"; }
          call() { curl -fksS -b jar -c jar -H 'X-Pxmxfw: 1' "$@"; }
          test "$(code "$api?action=file&name=settings")" = 401
          test "$(code -d '{"user":"root","password":"wrong"}' "$api?action=login")" = 401
          call -d '{"user":"root","password":"ci-test-pw"}' "$api?action=login"
          call "$api?action=file&name=settings" | grep -q '^IPV6=no'
          # changes need a fresh confirmation, and are validated by pxmxfw
          test "$(code --data-binary 'tcp 2222' "$api?action=save&name=services")" = 403
          call -d '{"password":"ci-test-pw"}' "$api?action=stepup"
          test "$(code --data-binary 'tcp 22; reboot' "$api?action=save&name=services")" = 422
          call --data-binary 'tcp 2222 # test' "$api?action=save&name=services"
          grep -qx 'tcp 2222 # test' /tmp/fw/etc/pxmxfw/services
          call -o /dev/null https://127.0.0.1:8443/alpine.min.js
          sudo pkill -f pxmxfw-webui || true
          sudo umount /tmp/fw/proc /tmp/fw/dev
          cat webui.log

      - uses: actions/upload-artifact@v4
        with:
          name: pxmxfw-template
          path: out/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          # Fixed name so releases/latest/download/pxmxfw_amd64.tar.gz always works
          cp alpine-*-pxmxfw-*_amd64.tar.gz pxmxfw_amd64.tar.gz
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS --generate-notes
