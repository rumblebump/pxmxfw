name: Build template

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y busybox dnsmasq-base nftables shellcheck

      - name: Shellcheck
        run: |
          shellcheck -s sh -S warning -e SC2034 \
            rootfs/usr/sbin/pxmxfw rootfs/usr/lib/pxmxfw/lib.sh \
            rootfs/usr/share/pxmxfw/www/cgi-bin/api rootfs/etc/init.d/pxmxfw* tests/run.sh

      # As root, so generated rulesets are loaded into a throwaway netns
      - name: Tests (dash)
        run: sudo tests/run.sh
      - name: Tests (busybox ash, the shell Alpine uses)
        run: sudo SH="busybox ash" tests/run.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build template (podman)
        run: ./build.sh --podman -o out

      - name: Check config inside the template
        run: |
          sudo mkdir /tmp/fw
          sudo tar -xzf out/*.tar.gz -C /tmp/fw
          sudo mount --bind /dev /tmp/fw/dev
          sudo chroot /tmp/fw nft -c -f /etc/nftables.nft
          sudo chroot /tmp/fw dnsmasq --test
          ls -l out/

      - name: Check the web UI login inside the template
        run: |
          # The UI logs in with the container's root password
          echo 'root:ci-test-pw' | sudo chroot /tmp/fw chpasswd
          # Same steps as /etc/init.d/pxmxfw-webui
          sudo chroot /tmp/fw sh -c 'umask 077; pxmxfw webui-conf > /run/httpd.conf'
          sudo chroot /tmp/fw /bin/busybox-extras httpd -p 127.0.0.1:8081 \
            -h /usr/share/pxmxfw/www -c /run/httpd.conf
          sleep 1
          url='http://127.0.0.1:8081/cgi-bin/api?action=file&name=settings'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u root:wrong "$url")" = 401
          curl -fsS -u root:ci-test-pw "$url" | grep -q '^IPV6=no'
          curl -fsS -u root:ci-test-pw -o /dev/null http://127.0.0.1:8081/alpine.min.js
          sudo pkill -f 'busybox-extras httpd' || true
          sudo umount /tmp/fw/dev

      - uses: actions/upload-artifact@v4
        with:
          name: pxmxfw-template
          path: out/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          # Fixed name so releases/latest/download/pxmxfw_amd64.tar.gz always works
          cp alpine-*-pxmxfw-*_amd64.tar.gz pxmxfw_amd64.tar.gz
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS --generate-notes
