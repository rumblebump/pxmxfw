# pxmxfw: DNS forwarder and DHCP server for the LAN side (eth1).
# Give eth1 a static address in Proxmox, e.g. ip=192.168.10.1/24, and keep
# the range below inside that subnet.
interface=eth1
bind-interfaces
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=9.9.9.9
cache-size=1000

dhcp-authoritative
dhcp-range=192.168.10.100,192.168.10.200,255.255.255.0,12h
dhcp-option=option:router,192.168.10.1
dhcp-option=option:dns-server,192.168.10.1
